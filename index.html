<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Champion Guide & Feedback Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #091428;
            color: #f0f6fc;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a1428;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
        .lol-border {
            border: 1px solid #1e282d;
        }
        .lol-gold-text {
            color: #c8aa6e;
        }
        .lol-gold-bg {
            background-color: #c8aa6e;
        }
        .lol-gold-border {
            border-color: #c8aa6e;
        }
        .lol-card-hover:hover {
            border-color: #c8aa6e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-[#091428]">

    <!-- Header Navigation -->
    <header class="h-16 bg-[#0a1428] border-b border-[#1e282d] flex items-center justify-between px-6 z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center text-slate-900 font-bold text-xl shadow-lg">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-amber-100 tracking-wide">LOL NOTE & FEEDBACK</h1>
                <p class="text-xs text-slate-400">인게임 공략 & 플레이 피드백 노트</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="relative flex items-center bg-[#040d1a] border border-[#1e282d] rounded-md px-2 py-1 text-xs">
                <i class="fa-solid fa-key text-amber-400 mr-1.5"></i>
                <span class="text-slate-400 mr-1 hidden sm:inline">동기화 키:</span>
                <input type="text" id="sync-key-input" value="my-lol-note" placeholder="공유 키 입력" class="bg-transparent w-24 text-amber-200 font-mono focus:outline-none text-xs">
                <button id="btn-apply-sync-key" class="ml-1 px-1.5 py-0.5 bg-amber-600/80 hover:bg-amber-500 text-slate-950 font-bold rounded text-[10px] transition">
                    적용
                </button>
            </div>
            <button id="btn-add-line" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-200 border border-amber-900/50 rounded-md text-sm transition flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-plus text-xs"></i> 라인 추가
            </button>
            <button id="btn-add-champ" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-semibold rounded-md text-sm transition flex items-center gap-1.5 shadow-md">
                <i class="fa-solid fa-user-plus text-xs"></i> 챔피언 추가
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation (Lines & Champion Search) -->
        <aside class="w-80 bg-[#0a1428]/90 border-r border-[#1e282d] flex flex-col shrink-0">
            <!-- Position / Line Filter Bar -->
            <div class="p-4 border-b border-[#1e282d]">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">포지션 필터</label>
                <div id="lines-bar" class="flex flex-wrap gap-1.5">
                    <!-- Dynamic Line Buttons -->
                </div>
            </div>

            <!-- Search Bar -->
            <div class="p-3 border-b border-[#1e282d]">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="champ-search-input" placeholder="챔피언 이름 검색..." 
                           class="w-full bg-[#040d1a] border border-[#1e282d] rounded-md pl-9 pr-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                </div>
                <div class="flex justify-between items-center mt-2 px-1 text-xs text-slate-400">
                    <span>챔피언 목록 (<span id="champ-count">0</span>)</span>
                </div>
            </div>

            <!-- Champion List Scrollable Container -->
            <div id="champ-list" class="flex-1 overflow-y-auto p-3 grid grid-cols-2 gap-2">
                <!-- Champion Cards Rendered Here -->
            </div>
        </aside>

        <!-- Main Content Area (Guide & Feedback Sheet) -->
        <main class="flex-1 overflow-y-auto bg-[#040d1a] p-6">
            <!-- Empty State -->
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-500">
                <i class="fa-solid fa-shield-cat text-6xl mb-4 opacity-30"></i>
                <p class="text-base">좌측 목록에서 챔피언을 선택하여 공략 및 피드백을 작성하세요.</p>
            </div>

            <!-- Active Champion Guide View -->
            <div id="guide-content" class="hidden max-w-5xl mx-auto space-y-6">
                <!-- Top Champion Header Banner -->
                <div class="bg-[#0a1428] border border-[#1e282d] rounded-xl p-5 flex flex-col md:flex-row items-center justify-between gap-4 shadow-lg">
                    <div class="flex items-center gap-4">
                        <img id="detail-champ-img" src="" alt="" class="w-16 h-16 rounded-xl border-2 border-amber-500/50 object-cover bg-slate-900 shadow">
                        <div>
                            <div class="flex items-center gap-2">
                                <h2 id="detail-champ-name" class="text-2xl font-bold text-slate-100"></h2>
                                <span id="detail-champ-id" class="text-xs text-slate-500 font-mono"></span>
                                <button id="btn-edit-champ" class="ml-2 px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs rounded border border-amber-500/30 transition flex items-center gap-1">
                                    <i class="fa-solid fa-pen text-[10px]"></i> 정보 수정
                                </button>
                            </div>
                            <div id="detail-champ-lines" class="flex gap-1.5 mt-1.5 flex-wrap">
                                <!-- Line Badges -->
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                        <button id="btn-save-guide" class="px-5 py-2.5 bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 font-bold rounded-lg transition shadow-md flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-floppy-disk"></i> 설정 및 메모 저장
                        </button>
                    </div>
                </div>

                <!-- Tabs (In-game Guide vs Feedback History) -->
                <div class="flex border-b border-[#1e282d] gap-4 text-sm font-semibold">
                    <button id="tab-btn-guide" class="pb-3 text-amber-400 border-b-2 border-amber-400 transition flex items-center gap-2">
                        <i class="fa-solid fa-book-open"></i> 인게임 공략 노트
                    </button>
                    <button id="tab-btn-feedback" class="pb-3 text-slate-400 hover:text-slate-200 transition flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-check"></i> 나의 플레이 피드백 노트
                    </button>
                </div>

                <!-- TAB 1: IN-GAME GUIDE -->
                <div id="tab-content-guide" class="space-y-6">
                    <!-- Image URL input -->
                    <div class="bg-[#0a1428] border border-[#1e282d] rounded-xl p-4">
                        <label class="block text-xs font-semibold text-amber-200/80 mb-1.5">
                            <i class="fa-solid fa-image mr-1"></i> 커스텀 챔피언 / 아이템 참고 이미지 URL
                        </label>
                        <input type="text" id="input-image-url" placeholder="https://example.com/image.png (선택 사항)" 
                               class="w-full bg-[#040d1a] border border-[#1e282d] rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- 2 Grid Layout for Runes & Items -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Runes Box -->
                        <div class="bg-[#0a1428] border border-[#1e282d] rounded-xl p-4 flex flex-col">
                            <label class="text-sm font-bold text-amber-400 flex items-center gap-2 mb-2">
                                <i class="fa-solid fa-gem text-amber-500"></i> 추천 룬 세팅
                            </label>
                            <textarea id="text-runes" rows="5" placeholder="예: 주 룬 - 정밀(정복자 / 승전보 / 민첩함 / 최후의 저항)&#10;보조 룬 - 결의(뼈 부수기 / 과잉성장)" 
                                      class="w-full flex-1 bg-[#040d1a] border border-[#1e282d] rounded-lg p-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-amber-500 leading-relaxed resize-none"></textarea>
                        </div>

                        <!-- Items Box -->
                        <div class="bg-[#0a1428] border border-[#1e282d] rounded-xl p-4 flex flex-col">
                            <label class="text-sm font-bold text-amber-400 flex items-center gap-2 mb-2">
                                <i class="fa-solid fa-shield-halved text-amber-500"></i> 시작 & 코어 아이템 빌드
                            </label>
                            <textarea id="text-items" rows="5" placeholder="예: 시작: 도란의 검 + 1포션&#10;1코어: 삼위일체&#10;2코어: 발걸음 분쇄기 / 스테락의 도전" 
                                      class="w-full flex-1 bg-[#040d1a] border border-[#1e282d] rounded-lg p-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-amber-500 leading-relaxed resize-none"></textarea>
                        </div>
                    </div>

                    <!-- Jungle Route Special Box (Conditional or Always available) -->
                    <div id="jungle-route-container" class="bg-[#0a1428] border border-[#1e282d] rounded-xl p-4">
                        <label class="text-sm font-bold text-emerald-400 flex items-center gap-2 mb-2">
                            <i class="fa-solid fa-[#compass] text-emerald-500"></i> 정글 동선 & 바위게 타임라인 (정글 전용 메모)
                        </label>
                        <textarea id="text-jungle-path" rows="3" placeholder="예: 레드 -> 돌거북 -> 칼날부리 -> 바텀 3렙 갱킹 -> 탑 바위게 교전" 
                                  class="w-full bg-[#040d1a] border border-[#1e282d] rounded-lg p-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500 leading-relaxed resize-none"></textarea>
                    </div>

                    <!-- Matchup Counter & Tips Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Counters -->
                        <div class="bg-[#0a1428] border border-[#1e282d] rounded-xl p-4">
                            <label class="text-sm font-bold text-red-400 flex items-center gap-2 mb-2">
                                <i class="fa-solid fa-skull text-red-500"></i> 상대하기 까다로운 카운터 / 쉬운 상성
                            </label>
                            <textarea id="text-counters" rows="4" placeholder="어려운 챔피언: 잭스 (반격 주의), 제이스 (거리 조절)&#10;쉬운 챔피언: 사이온, 쉔" 
                                      class="w-full bg-[#040d1a] border border-[#1e282d] rounded-lg p-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-red-500 leading-relaxed resize-none"></textarea>
                        </div>

                        <!-- Matchup Tips -->
                        <div class="bg-[#0a1428] border border-[#1e282d] rounded-xl p-4">
                            <label class="text-sm font-bold text-blue-400 flex items-center gap-2 mb-2">
                                <i class="fa-solid fa-lightbulb text-blue-500"></i> 라인전 핵심 팁 & 한타 상대법
                            </label>
                            <textarea id="text-matchup-tips" rows="4" placeholder="1~2렙 구간 E스킬 평타 판정 활용하여 딜교. 6렙 궁극기 시 타이밍 맞춰 진입" 
                                      class="w-full bg-[#040d1a] border border-[#1e282d] rounded-lg p-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 leading-relaxed resize-none"></textarea>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: PLAY FEEDBACK HISTORY -->
                <div id="tab-content-feedback" class="space-y-6 hidden">
                    <!-- New Feedback Form -->
                    <div class="bg-[#0a1428] border border-[#1e282d] rounded-xl p-5 shadow">
                        <h3 class="font-bold text-base text-amber-200 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square"></i> 새로운 판 피드백 작성
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">상대한 챔피언</label>
                                <input type="text" id="fb-vs-champ" placeholder="예: 레넥톤" class="w-full bg-[#040d1a] border border-[#1e282d] rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">승패 결과</label>
                                <select id="fb-result" class="w-full bg-[#040d1a] border border-[#1e282d] rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                                    <option value="승리">승리 (WIN)</option>
                                    <option value="패배">패배 (LOSS)</option>
                                    <option value="기타">연습 / 일반판</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs font-semibold text-slate-400 mb-1">잘한 점 & 피드백 내용 메모</label>
                            <textarea id="fb-text" rows="3" placeholder="예: 3렙 바위게 교전 시 상대 점멸 체크 후 갱킹 호응 잘했음. 다만 라인 복귀 시 템트리를 조금 늦게 올려서 아쉬움." 
                                      class="w-full bg-[#040d1a] border border-[#1e282d] rounded-lg p-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-amber-500 leading-relaxed resize-none"></textarea>
                        </div>
                        <div class="flex justify-end">
                            <button id="btn-add-feedback" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-sm rounded-lg transition flex items-center gap-1.5">
                                <i class="fa-solid fa-plus text-xs"></i> 피드백 기록 추가
                            </button>
                        </div>
                    </div>

                    <!-- Feedback List History -->
                    <div id="feedback-list-container" class="space-y-3">
                        <!-- Dynamic History Cards -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL 1: ADD LINE -->
    <div id="modal-add-line" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-[#0a1428] border border-amber-600/40 rounded-xl p-6 w-full max-w-md shadow-2xl space-y-4">
            <h3 class="font-bold text-lg text-amber-200 flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> 새로운 라인/포지션 추가
            </h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">라인 이름</label>
                <input type="text" id="input-new-line-name" placeholder="예: 미드/서폿, 칼바람" class="w-full bg-[#040d1a] border border-[#1e282d] rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="btn-cancel-line" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm rounded-md">취소</button>
                <button id="btn-save-line" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-sm rounded-md">라인 추가</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: ADD / EDIT CHAMPION -->
    <div id="modal-add-champ" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-[#0a1428] border border-amber-600/40 rounded-xl p-6 w-full max-w-lg shadow-2xl space-y-4">
            <h3 id="modal-champ-title" class="font-bold text-lg text-amber-200 flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> 새로운 챔피언 등록
            </h3>
            <input type="hidden" id="input-edit-target-id" value="">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">챔피언 한글 이름</label>
                    <input type="text" id="input-new-champ-name" placeholder="예: 로크, 암베사, 멜" class="w-full bg-[#040d1a] border border-[#1e282d] rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">영문 ID (고유 식별자)</label>
                    <input type="text" id="input-new-champ-id" placeholder="예: lok, ambessa, mel" class="w-full bg-[#040d1a] border border-[#1e282d] rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">소속 라인 (여러 개 선택 가능)</label>
                <div id="modal-lines-checkboxes" class="flex flex-wrap gap-2 p-3 bg-[#040d1a] border border-[#1e282d] rounded-md max-h-32 overflow-y-auto">
                    <!-- Dynamic Checkboxes -->
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">초상화/사진 URL (수정 가능)</label>
                <input type="text" id="input-new-champ-icon" placeholder="https://..." class="w-full bg-[#040d1a] border border-[#1e282d] rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="btn-cancel-champ" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm rounded-md">취소</button>
                <button id="btn-save-champ" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-sm rounded-md">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-msg" class="fixed bottom-6 right-6 bg-slate-800 border border-amber-500/50 text-slate-100 px-4 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition duration-300 z-50 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-amber-400"></i>
        <span id="toast-text" class="text-sm">저장되었습니다.</span>
    </div>

    <!-- Firebase SDK Imports & Application Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Configuration & Safety Handling for GitHub Pages
        const firebaseConfigRaw = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        let firebaseConfig = null;
        if (firebaseConfigRaw) {
            try { firebaseConfig = JSON.parse(firebaseConfigRaw); } catch(e) {}
        }
        
        // Dynamic Sync Key across multiple devices
        let currentSyncKey = localStorage.getItem("lol_sync_key") || 'my-lol-note';
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lol-guide-shared-app';

        let app = null, auth = null, db = null, currentUser = null;
        let unsubscribeSnapshot = null;

        if (firebaseConfig && firebaseConfig.apiKey) {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } catch(e) {
                console.warn("Firebase Init bypassed:", e);
            }
        }

        // Full Fallback Database for Champions (All 173+ including new Lok, Ambessa, Mel)
        const FALLBACK_CHAMPIONS = [
            { id: "lok", name: "로크", lines: ["탑", "정글"] },
            { id: "ambessa", name: "암베사", lines: ["탑", "미드"] },
            { id: "mel", name: "멜", lines: ["미드", "서폿"] },
            { id: "smolder", name: "스몰더", lines: ["원딜", "미드"] },
            { id: "briar", name: "브라이어", lines: ["정글", "탑"] },
            { id: "naafiri", name: "나피리", lines: ["미드"] },
            { id: "milio", name: "밀리오", lines: ["서폿"] },
            { id: "ksante", name: "크산테", lines: ["탑"] },

        async function initApp() {
            // Set Sync Key Input UI
            const syncInput = document.getElementById("sync-key-input");
            if (syncInput) syncInput.value = currentSyncKey;

            // Load LocalStorage backup first
            const localLines = localStorage.getItem("lol_app_lines");
            const localChamps = localStorage.getItem("lol_app_champs");
            const localGuides = localStorage.getItem("lol_app_guides");

            if (localLines) {
                try { linesState = JSON.parse(localLines); } catch(e){}
            }
            if (localChamps) {
                try { championsState = JSON.parse(localChamps); } catch(e){}
            }
            if (localGuides) {
                try { guidesData = JSON.parse(localGuides); } catch(e){}
            }

            renderLines();
            renderChampions();
            setupEventListeners();

            // Firebase authentication and global sync setup
            if (auth) {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.warn("Auth initialization fallback:", err);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        // Start real-time sync with current sync key
                        subscribeToData();
                    }
                });
            }
        }

        // Real-time synchronization callback across devices based on Sync Key
        function subscribeToData() {
            if (!currentUser || !db) return;
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot(); // Unsubscribe previous listener if key changed
            }

            const cleanKey = currentSyncKey.trim() || 'my-lol-note';
            // Public cloud storage path for multi-device sync with custom key
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'lol_shared_guides', cleanKey);
            
            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.lines && Array.isArray(data.lines)) {
                        linesState = data.lines;
                        localStorage.setItem("lol_app_lines", JSON.stringify(linesState));
                    }
                    if (data.champions && Array.isArray(data.champions)) {
                        championsState = data.champions;
                        localStorage.setItem("lol_app_champs", JSON.stringify(championsState));
                    }
                    if (data.guides && typeof data.guides === 'object') {
                        guidesData = { ...SEED_GUIDES, ...data.guides };
                        localStorage.setItem("lol_app_guides", JSON.stringify(guidesData));
                    }
                    renderLines();
                    renderChampions();
                    if (selectedChampId) {
                        loadGuideDetails(selectedChampId);
                    }
                }
            }, (err) => {
                console.warn("Firestore snapshot error:", err);
            });
        }

        async function syncDataToCloud() {
            // Save to LocalStorage immediately
            localStorage.setItem("lol_app_lines", JSON.stringify(linesState));
            localStorage.setItem("lol_app_champs", JSON.stringify(championsState));
            localStorage.setItem("lol_app_guides", JSON.stringify(guidesData));

            if (!currentUser || !db) {
                showToast("로컬에 저장되었습니다. (동기화하려면 온라인 연결 필요)");
                return;
            }

            const cleanKey = currentSyncKey.trim() || 'my-lol-note';
            // Sync to shared public Firestore path
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'lol_shared_guides', cleanKey);
            try {
                await setDoc(docRef, {
                    lines: linesState,
                    champions: championsState,
                    guides: guidesData,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                showToast(`[${cleanKey}] 동기화 키로 데이터가 저장되었습니다!`);
            } catch (err) {
                console.error("Error saving data to Firestore:", err);
                showToast("로컬 저장 완료 (구름 동기화 실패)", true);
            }
        }

        function renderLines() {
            const container = document.getElementById("lines-bar");
            if (!container) return;
            container.innerHTML = "";

            linesState.forEach(line => {
                const btn = document.createElement("button");
                const isActive = activeLineFilter === line;
                btn.className = `px-3 py-1 rounded-md text-xs font-semibold transition ${
                    isActive 
                    ? "bg-amber-500 text-slate-950 font-bold shadow-md" 
                    : "bg-[#040d1a] text-slate-400 hover:text-slate-100 border border-[#1e282d]"
                }`;
                btn.innerText = line;
                btn.onclick = () => {
                    activeLineFilter = line;
                    renderLines();
                    renderChampions();
                };
                container.appendChild(btn);
            });
        }

        function getChampImageUrl(champ) {
            if (champ.iconUrl && champ.iconUrl.trim() !== '') return champ.iconUrl;
            // Riot Data Dragon Fallback Image
            const formattedId = champ.id.charAt(0).toUpperCase() + champ.id.slice(1);
            return `https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${formattedId}.png`;
        }

        function renderChampions() {
            const container = document.getElementById("champ-list");
            const countLabel = document.getElementById("champ-count");
            if (!container) return;
            container.innerHTML = "";

            const filtered = championsState.filter(c => {
                const matchLine = activeLineFilter === "전체" || (c.lines && c.lines.includes(activeLineFilter));
                const matchQuery = !searchQuery || c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.id.toLowerCase().includes(searchQuery.toLowerCase());
                return matchLine && matchQuery;
            });

            if (countLabel) countLabel.innerText = filtered.length;

            filtered.forEach(c => {
                const card = document.createElement("div");
                const isSelected = selectedChampId === c.id;
                card.className = `bg-[#0a1428] border ${isSelected ? 'border-amber-500 bg-amber-950/20' : 'border-[#1e282d]'} rounded-xl p-2.5 flex items-center gap-2.5 cursor-pointer lol-card-hover transition relative group`;
                
                const imgUrl = getChampImageUrl(c);
                card.innerHTML = `
                    <img src="${imgUrl}" onerror="this.src='https://placehold.co/80x80/091428/c8aa6e?text=${encodeURIComponent(c.name)}'" class="w-10 h-10 rounded-lg object-cover bg-slate-900 border border-slate-700/50">
                    <div class="overflow-hidden">
                        <div class="font-bold text-xs text-slate-200 truncate group-hover:text-amber-300 transition">${c.name}</div>
                        <div class="text-[10px] text-slate-500 truncate">${(c.lines || []).join(', ')}</div>
                    </div>
                `;
                card.onclick = () => selectChampion(c.id);
                container.appendChild(card);
            });
        }

        function selectChampion(id) {
            selectedChampId = id;
            renderChampions();
            loadGuideDetails(id);
        }

        function loadGuideDetails(id) {
            const champ = championsState.find(c => c.id === id);
            if (!champ) return;

            document.getElementById("empty-state").classList.add("hidden");
            document.getElementById("guide-content").classList.remove("hidden");

            document.getElementById("detail-champ-name").innerText = champ.name;
            document.getElementById("detail-champ-id").innerText = `#${champ.id}`;
            document.getElementById("detail-champ-img").src = getChampImageUrl(champ);

            const linesBadgeContainer = document.getElementById("detail-champ-lines");
            linesBadgeContainer.innerHTML = "";
            (champ.lines || []).forEach(l => {
                const badge = document.createElement("span");
                badge.className = "px-2 py-0.5 bg-amber-950/60 text-amber-300 border border-amber-800/50 text-xs rounded font-medium";
                badge.innerText = l;
                linesBadgeContainer.appendChild(badge);
            });

            // Populate guide input fields
            const g = guidesData[id] || {};
            document.getElementById("input-image-url").value = g.imageUrl || "";
            document.getElementById("text-runes").value = g.runes || "";
            document.getElementById("text-items").value = g.items || "";
            document.getElementById("text-jungle-path").value = g.junglePath || "";
            document.getElementById("text-counters").value = g.counters || "";
            document.getElementById("text-matchup-tips").value = g.matchupTips || "";

            renderFeedbackList(g.feedbackList || []);
        }

        function renderFeedbackList(list) {
            const container = document.getElementById("feedback-list-container");
            if (!container) return;
            container.innerHTML = "";

            if (!list || list.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 py-4 text-center">등록된 피드백 노트가 없습니다.</p>`;
                return;
            }

            list.forEach((item, index) => {
                const card = document.createElement("div");
                const isWin = item.result === "승리";
                card.className = `bg-[#0a1428] border border-[#1e282d] rounded-xl p-4 flex flex-col gap-2 relative`;
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 ${isWin ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-red-950 text-red-400 border-red-800'} border text-xs font-bold rounded">
                                ${item.result}
                            </span>
                            <span class="font-bold text-sm text-slate-200">vs ${item.vsChamp || '미상'}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-[11px] text-slate-500">${item.date}</span>
                            <button class="btn-del-fb text-slate-500 hover:text-red-400 text-xs transition" data-index="${index}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap mt-1">${item.text}</p>
                `;
                container.appendChild(card);
            });

            document.querySelectorAll(".btn-del-fb").forEach(btn => {
                btn.onclick = (e) => {
                    const idx = parseInt(e.currentTarget.getAttribute("data-index"));
                    if (selectedChampId && guidesData[selectedChampId] && guidesData[selectedChampId].feedbackList) {
                        guidesData[selectedChampId].feedbackList.splice(idx, 1);
                        renderFeedbackList(guidesData[selectedChampId].feedbackList);
                        syncDataToCloud();
                    }
                };
            });
        }

        function setupEventListeners() {
            // Sync Key Apply Button
            const btnApplyKey = document.getElementById("btn-apply-sync-key");
            if (btnApplyKey) {
                btnApplyKey.onclick = () => {
                    const inputVal = document.getElementById("sync-key-input").value.trim();
                    if (!inputVal) {
                        showToast("동기화 키를 입력해 주세요.");
                        return;
                    }
                    currentSyncKey = inputVal;
                    localStorage.setItem("lol_sync_key", currentSyncKey);
                    subscribeToData();
                    showToast(`동기화 키가 '${currentSyncKey}'(으)로 변경되었습니다.`);
                };
            }

            // Search input
            document.getElementById("champ-search-input").addEventListener("input", (e) => {
                searchQuery = e.target.value;
                renderChampions();
            });

            // Tab Switching Logic
            const tabBtnGuide = document.getElementById("tab-btn-guide");
            const tabBtnFeedback = document.getElementById("tab-btn-feedback");
            const tabContentGuide = document.getElementById("tab-content-guide");
            const tabContentFeedback = document.getElementById("tab-content-feedback");

            if (tabBtnGuide && tabBtnFeedback) {
                tabBtnGuide.onclick = () => {
                    tabBtnGuide.className = "pb-3 text-amber-400 border-b-2 border-amber-400 transition flex items-center gap-2";
                    tabBtnFeedback.className = "pb-3 text-slate-400 hover:text-slate-200 transition flex items-center gap-2";
                    tabContentGuide.classList.remove("hidden");
                    tabContentFeedback.classList.add("hidden");
                };

                tabBtnFeedback.onclick = () => {
                    tabBtnFeedback.className = "pb-3 text-amber-400 border-b-2 border-amber-400 transition flex items-center gap-2";
                    tabBtnGuide.className = "pb-3 text-slate-400 hover:text-slate-200 transition flex items-center gap-2";
                    tabContentFeedback.classList.remove("hidden");
                    tabContentGuide.classList.add("hidden");
                };
            }

            // Save Guide Memo Button
            const btnSaveGuide = document.getElementById("btn-save-guide");
            if (btnSaveGuide) {
                btnSaveGuide.onclick = () => {
                    if (!selectedChampId) return;
                    if (!guidesData[selectedChampId]) {
                        guidesData[selectedChampId] = { feedbackList: [] };
                    }
                    const g = guidesData[selectedChampId];
                    g.imageUrl = document.getElementById("input-image-url").value.trim();
                    g.runes = document.getElementById("text-runes").value.trim();
                    g.items = document.getElementById("text-items").value.trim();
                    g.junglePath = document.getElementById("text-jungle-path").value.trim();
                    g.counters = document.getElementById("text-counters").value.trim();
                    g.matchupTips = document.getElementById("text-matchup-tips").value.trim();

                    // Update Image if changed
                    const champ = championsState.find(c => c.id === selectedChampId);
                    if (champ && g.imageUrl) {
                        champ.iconUrl = g.imageUrl;
                        document.getElementById("detail-champ-img").src = getChampImageUrl(champ);
                        renderChampions();
                    }

                    syncDataToCloud();
                };
            }

            // Add Feedback Note Button
            const btnAddFeedback = document.getElementById("btn-add-feedback");
            if (btnAddFeedback) {
                btnAddFeedback.onclick = () => {
                    if (!selectedChampId) return;
                    const vsChamp = document.getElementById("fb-vs-champ").value.trim();
                    const result = document.getElementById("fb-result").value;
                    const text = document.getElementById("fb-text").value.trim();

                    if (!text) {
                        showToast("피드백 내용을 작성해주세요.");
                        return;
                    }

                    if (!guidesData[selectedChampId]) {
                        guidesData[selectedChampId] = { feedbackList: [] };
                    }
                    if (!guidesData[selectedChampId].feedbackList) {
                        guidesData[selectedChampId].feedbackList = [];
                    }

                    const now = new Date();
                    const dateStr = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                    guidesData[selectedChampId].feedbackList.unshift({
                        vsChamp: vsChamp || "미상",
                        result: result,
                        text: text,
                        date: dateStr
                    });

                    // Clear inputs
                    document.getElementById("fb-vs-champ").value = "";
                    document.getElementById("fb-text").value = "";

                    renderFeedbackList(guidesData[selectedChampId].feedbackList);
                    syncDataToCloud();
                };
            }

            // Line Modal Logic
            const modalLine = document.getElementById("modal-add-line");
            document.getElementById("btn-add-line").onclick = () => {
                document.getElementById("input-new-line-name").value = "";
                modalLine.classList.remove("hidden");
            };
            document.getElementById("btn-cancel-line").onclick = () => modalLine.classList.add("hidden");
            document.getElementById("btn-save-line").onclick = () => {
                const lineName = document.getElementById("input-new-line-name").value.trim();
                if (lineName && !linesState.includes(lineName)) {
                    linesState.push(lineName);
                    renderLines();
                    syncDataToCloud();
                }
                modalLine.classList.add("hidden");
            };

            // Edit Champion Info Button
            document.getElementById("btn-edit-champ").onclick = () => {
                if (!selectedChampId) return;
                const champ = championsState.find(c => c.id === selectedChampId);
                if (!champ) return;

                document.getElementById("modal-champ-title").innerHTML = `<i class="fa-solid fa-pen"></i> 챔피언 정보 수정`;
                document.getElementById("input-edit-target-id").value = champ.id;
                document.getElementById("input-new-champ-name").value = champ.name;
                document.getElementById("input-new-champ-id").value = champ.id;
                document.getElementById("input-new-champ-id").disabled = true; // ID는 고유키이므로 비활성화
                document.getElementById("input-new-champ-icon").value = champ.iconUrl || "";

                renderModalLineCheckboxes(champ.lines || []);
                document.getElementById("modal-add-champ").classList.remove("hidden");
            };

            // Modal: Add Champion Button
            const modalChamp = document.getElementById("modal-add-champ");
            document.getElementById("btn-add-champ").onclick = () => {
                document.getElementById("modal-champ-title").innerHTML = `<i class="fa-solid fa-user-plus"></i> 새로운 챔피언 등록`;
                document.getElementById("input-edit-target-id").value = "";
                document.getElementById("input-new-champ-name").value = "";
                document.getElementById("input-new-champ-id").value = "";
                document.getElementById("input-new-champ-id").disabled = false;
                document.getElementById("input-new-champ-icon").value = "";
                renderModalLineCheckboxes([]);
                modalChamp.classList.remove("hidden");
            };
            document.getElementById("btn-cancel-champ").onclick = () => modalChamp.classList.add("hidden");

            // Save / Update Champion Info
            document.getElementById("btn-save-champ").onclick = () => {
                const targetId = document.getElementById("input-edit-target-id").value;
                const name = document.getElementById("input-new-champ-name").value.trim();
                let id = document.getElementById("input-new-champ-id").value.trim().toLowerCase();
                const iconUrl = document.getElementById("input-new-champ-icon").value.trim();

                if (!name) {
                    showToast("챔피언 이름을 입력하세요.");
                    return;
                }
                if (!id) id = name.toLowerCase().replace(/\s+/g, '');

                const selectedLines = [];
                document.querySelectorAll(".cb-modal-line:checked").forEach(cb => {
                    selectedLines.push(cb.value);
                });

                if (targetId) {
                    // Update Existing Champion
                    const idx = championsState.findIndex(c => c.id === targetId);
                    if (idx >= 0) {
                        championsState[idx].name = name;
                        championsState[idx].lines = selectedLines;
                        championsState[idx].iconUrl = iconUrl;
                    }
                } else {
                    // Add New Champion
                    const existingIndex = championsState.findIndex(c => c.id === id);
                    if (existingIndex >= 0) {
                        championsState[existingIndex] = { id, name, lines: selectedLines, iconUrl };
                    } else {
                        championsState.unshift({ id, name, lines: selectedLines, iconUrl });
                    }
                }

                renderChampions();
                if (selectedChampId) {
                    loadGuideDetails(selectedChampId);
                }
                syncDataToCloud();

                modalChamp.classList.add("hidden");
            };
        }

        function renderModalLineCheckboxes(selectedLines = []) {
            const container = document.getElementById("modal-lines-checkboxes");
            if (!container) return;
            container.innerHTML = "";

            linesState.filter(l => l !== "전체").forEach(line => {
                const isChecked = selectedLines.includes(line);
                const label = document.createElement("label");
                label.className = "flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer bg-slate-800 px-2.5 py-1 rounded border border-slate-700";
                label.innerHTML = `
                    <input type="checkbox" value="${line}" ${isChecked ? 'checked' : ''} class="cb-modal-line accent-amber-500">
                    <span>${line}</span>
                `;
                container.appendChild(label);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById("toast-msg");
            const text = document.getElementById("toast-text");
            if (!toast || !text) return;
            text.innerText = msg;
            toast.classList.remove("translate-y-20", "opacity-0");
            setTimeout(() => {
                toast.classList.add("translate-y-20", "opacity-0");
            }, 2500);
        }
    </script>
</body>
</html>

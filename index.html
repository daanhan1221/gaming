<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Champion Guide & Personal Feedback Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #091428;
            color: #f0e6d2;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #091428;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e2328;
            border: 1px solid #c8aa6e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c8aa6e;
        }
        .hextech-card {
            background: linear-gradient(135deg, #0a1428 0%, #091428 100%);
            border: 1px solid #1e2328;
            transition: all 0.2s ease-in-out;
        }
        .hextech-card:hover {
            border-color: #c8aa6e;
            box-shadow: 0 0 15px rgba(200, 170, 110, 0.2);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #f0e6d2 0%, #c8aa6e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-yellow-600 selection:text-white">

    <!-- Top Header -->
    <header class="bg-[#091428] border-b border-[#c8aa6e]/40 sticky top-0 z-40 shadow-xl backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-halved text-2xl text-[#c8aa6e]"></i>
                <h1 class="text-xl font-bold tracking-wider gold-gradient-text uppercase">LoL Note & Feedback</h1>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-4">
                <button id="btn-add-line" class="px-3 py-1.5 bg-[#1e2328] hover:bg-[#2b3138] border border-[#c8aa6e]/50 text-xs sm:text-sm font-semibold rounded text-[#c8aa6e] transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> 라인 추가
                </button>
                <button id="btn-add-champ" class="px-3 py-1.5 bg-[#c8aa6e] hover:bg-[#785a28] hover:text-white text-[#091428] font-bold text-xs sm:text-sm rounded transition flex items-center gap-1 shadow-lg">
                    <i class="fa-solid fa-user-plus"></i> 챔피언 추가
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Sidebar: Line Filters & Champion Search List -->
        <aside class="lg:col-span-4 xl:col-span-3 flex flex-col gap-4">
            <!-- Line Tabs -->
            <div class="bg-[#0a1428] p-3 rounded-lg border border-[#1e2328] shadow-md">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">포지션 필터</h2>
                <div id="line-tab-container" class="flex flex-wrap gap-1.5">
                    <!-- Dynamic Line Buttons -->
                </div>
            </div>

            <!-- Search & Champ List -->
            <div class="bg-[#0a1428] p-4 rounded-lg border border-[#1e2328] shadow-md flex-1 flex flex-col">
                <div class="relative mb-3">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
                    <input type="text" id="champ-search-input" placeholder="챔피언 이름 검색..." 
                        class="w-full pl-9 pr-3 py-2 bg-[#091428] border border-[#1e2328] rounded focus:outline-none focus:border-[#c8aa6e] text-sm text-gray-200">
                </div>
                
                <div class="flex items-center justify-between text-xs text-gray-400 mb-2 px-1">
                    <span>챔피언 목록 (<span id="champ-count">0</span>)</span>
                </div>

                <div id="champion-grid" class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-3 gap-2 overflow-y-auto max-h-[60vh] lg:max-h-[calc(100vh-280px)] pr-1">
                    <!-- Champion cards -->
                </div>
            </div>
        </aside>

        <!-- Main Guide & Feedback Editor Display -->
        <main class="lg:col-span-8 xl:col-span-9 flex flex-col">
            <div id="guide-display-container" class="bg-[#0a1428] border border-[#1e2328] rounded-lg p-5 lg:p-6 shadow-xl min-h-[650px] flex flex-col justify-between">
                
                <!-- No Selection Placeholder -->
                <div id="no-selection-view" class="flex flex-col items-center justify-center my-auto py-20 text-gray-500">
                    <i class="fa-solid fa-helmet-safety text-6xl mb-4 text-[#1e2328]"></i>
                    <p class="text-lg font-medium">좌측 목록에서 챔피언을 선택하여 공략 및 피드백을 작성하세요.</p>
                </div>

                <!-- Champion Detail View -->
                <div id="guide-detail-view" class="hidden space-y-6">
                    <!-- Champ Banner Header -->
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-[#1e2328] pb-4">
                        <div class="flex items-center gap-4">
                            <img id="detail-champ-img" src="" alt="" class="w-16 h-16 sm:w-20 sm:h-20 rounded-lg object-cover border-2 border-[#c8aa6e] shadow-md bg-black">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h2 id="detail-champ-name" class="text-2xl sm:text-3xl font-extrabold text-[#f0e6d2]"></h2>
                                    <span id="detail-champ-lane" class="px-2 py-0.5 bg-[#1e2328] text-[#c8aa6e] text-xs font-bold rounded border border-[#c8aa6e]/30"></span>
                                </div>
                                <p id="detail-champ-title" class="text-xs text-gray-400 mt-1"></p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 self-end sm:self-center">
                            <button id="btn-save-guide" class="px-4 py-2 bg-[#c8aa6e] hover:bg-[#785a28] text-[#091428] font-bold text-sm rounded shadow transition flex items-center gap-2">
                                <i class="fa-solid fa-floppy-disk"></i> 저장하기
                            </button>
                            <button id="btn-edit-champ" class="px-3 py-2 bg-[#1e2328] hover:bg-gray-700 text-gray-300 text-sm rounded transition" title="챔피언 정보 수정">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Navigation Tabs -->
                    <div class="flex border-b border-[#1e2328] gap-4 text-sm font-semibold">
                        <button id="tab-btn-guide" class="pb-2 border-b-2 border-[#c8aa6e] text-[#c8aa6e] flex items-center gap-2 font-bold">
                            <i class="fa-solid fa-book-bookmark"></i> 인게임 공략
                        </button>
                        <button id="tab-btn-feedback" class="pb-2 border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2">
                            <i class="fa-solid fa-clipboard-check"></i> 나의 플레이 피드백
                        </button>
                    </div>

                    <!-- TAB 1: In-Game Guide Form -->
                    <div id="tab-content-guide" class="space-y-6">
                        <!-- Runes & Starting Items -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-[#091428] p-4 rounded border border-[#1e2328]">
                                <h3 class="text-sm font-bold text-[#c8aa6e] mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-feather"></i> 추천 룬 세팅
                                </h3>
                                <textarea id="guide-runes" rows="4" placeholder="예: 정밀 - 치명적 속도 / 승전보 / 민첩함 / 최후의 일격&#10;보조: 영감 - 마법의 신발 / 우주적 통찰력"
                                    class="w-full p-2.5 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200 resize-none"></textarea>
                            </div>

                            <div class="bg-[#091428] p-4 rounded border border-[#1e2328]">
                                <h3 class="text-sm font-bold text-[#c8aa6e] mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-shield"></i> 시작 아이템 & 핵심 빌드
                                </h3>
                                <textarea id="guide-items" rows="4" placeholder="시작: 도란의 검 + 1포션&#10;핵심 코어: 크라켄 학살자 -> 나보리 신속검 -> 도미닉 경의 인사"
                                    class="w-full p-2.5 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200 resize-none"></textarea>
                            </div>
                        </div>

                        <!-- Matchup & Counter Section -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-[#091428] p-4 rounded border border-[#1e2328]">
                                <h3 class="text-sm font-bold text-red-400 mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-skull"></i> 쉬운/어려운 상성 (카운터)
                                </h3>
                                <textarea id="guide-counters" rows="4" placeholder="상대하기 편함: 말파이트, 사이온&#10;어려움/카운터: 잭스(E 스킬 주의), 르블랑(폭딜 조심)"
                                    class="w-full p-2.5 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200 resize-none"></textarea>
                            </div>

                            <div class="bg-[#091428] p-4 rounded border border-[#1e2328]">
                                <h3 class="text-sm font-bold text-[#c8aa6e] mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-swords"></i> 라인전 & 한타 상대법
                                </h3>
                                <textarea id="guide-matchup-tips" rows="4" placeholder="라인전: 3렙 전까지 사리고 Q견제 위주로 딜교&#10;한타: 상대 주요 CC기 빠진 후 진입하여 딜링"
                                    class="w-full p-2.5 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200 resize-none"></textarea>
                            </div>
                        </div>

                        <!-- Jungle Path (Jungle Champions Only) -->
                        <div id="jungle-path-section" class="bg-[#091428] p-4 rounded border border-[#1e2328]">
                            <h3 class="text-sm font-bold text-emerald-400 mb-2 flex items-center gap-2">
                                <i class="fa-solid fa-tree"></i> 정글 추천 동선 (정글 전용)
                            </h3>
                            <textarea id="guide-jungle-path" rows="3" placeholder="예: 레드 -> 돌거북 -> 칼날부비 -> 바텀 3렙 갱킹 -> 바위게"
                                class="w-full p-2.5 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200 resize-none"></textarea>
                        </div>

                        <!-- Extra Image Attachment -->
                        <div class="bg-[#091428] p-4 rounded border border-[#1e2328]">
                            <h3 class="text-sm font-bold text-[#c8aa6e] mb-2 flex items-center gap-2">
                                <i class="fa-solid fa-image"></i> 참고요약 이미지 URL (선택)
                            </h3>
                            <div class="flex gap-2">
                                <input type="url" id="guide-image-url" placeholder="https://..." 
                                    class="flex-1 p-2 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200">
                            </div>
                            <div id="guide-image-preview-box" class="mt-3 hidden">
                                <img id="guide-image-preview" src="" alt="공략 참고 이미지" class="max-h-48 rounded border border-[#1e2328] object-contain bg-black">
                            </div>
                        </div>
                    </div>

                    <!-- TAB 2: Personal Feedback Logs -->
                    <div id="tab-content-feedback" class="hidden space-y-6">
                        <!-- New Feedback Entry Form -->
                        <div class="bg-[#091428] p-4 rounded border border-[#1e2328] space-y-3">
                            <h3 class="text-sm font-bold text-[#c8aa6e] flex items-center gap-2">
                                <i class="fa-solid fa-pen"></i> 새로운 게임 피드백 작성
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <input type="text" id="fb-vs-champ" placeholder="상대 챔피언 (예: 제드)" 
                                    class="p-2 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200">
                                <select id="fb-result" class="p-2 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200">
                                    <option value="승리">승리</option>
                                    <option value="패배">패배</option>
                                    <option value="연습">연습/기타</option>
                                </select>
                            </div>
                            <textarea rows="3" placeholder="오늘 게임에서 잘한 점, 실수한 점, 다음 판 주의할 점을 적어보세요..."
                                class="w-full p-2.5 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200 resize-none"></textarea>
                            <button id="btn-add-feedback" class="px-4 py-2 bg-[#1e2328] hover:bg-[#c8aa6e] hover:text-[#091428] border border-[#c8aa6e]/50 text-xs font-bold rounded text-[#c8aa6e] transition flex items-center gap-1 ml-auto">
                                <i class="fa-solid fa-plus"></i> 피드백 저장
                            </button>
                        </div>

                        <!-- Feedback History List -->
                        <div class="space-y-3">
                            <h3 class="text-sm font-bold text-gray-400">지난 피드백 기록</h3>
                            <div id="feedback-history-list" class="space-y-2">
                                <!-- Dynamic List -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Toast Banner Notification -->
    <div id="toast" class="fixed bottom-5 right-5 px-4 py-3 rounded-lg shadow-2xl bg-[#c8aa6e] text-[#091428] font-bold text-sm hidden items-center gap-2 z-50 transition-all">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-msg">알림 메시지</span>
    </div>

    <!-- Modal: Add Line -->
    <div id="modal-line" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-[#091428] border border-[#c8aa6e] rounded-lg p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-[#c8aa6e]">새 포지션/라인 추가</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">라인 이름</label>
                    <input type="text" id="input-line-name" placeholder="예: 칼바람, 칼날비, 칼바람나락 등" 
                        class="w-full p-2 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">아이콘 선택</label>
                    <select id="input-line-icon" class="w-full p-2 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200">
                        <option value="fa-shield">방패 (탑)</option>
                        <option value="fa-tree">나무 (정글)</option>
                        <option value="fa-hat-wizard">마법사 (미드)</option>
                        <option value="fa-crosshair">조준점 (원딜)</option>
                        <option value="fa-hands-holding-circle">손길 (서폿)</option>
                        <option value="fa-bolt">번개</option>
                        <option value="fa-[#c8aa6e] fa-star">별</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="btn-close-line-modal" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-xs font-bold rounded">취소</button>
                <button id="btn-confirm-line-modal" class="px-4 py-2 bg-[#c8aa6e] hover:bg-[#785a28] text-[#091428] text-xs font-bold rounded">추가하기</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add/Edit Champion -->
    <div id="modal-champ" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-[#091428] border border-[#c8aa6e] rounded-lg p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 id="modal-champ-title" class="text-lg font-bold text-[#c8aa6e]">챔피언 추가/수정</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">챔피언 이름</label>
                    <input type="text" id="input-champ-name" placeholder="예: 로크" 
                        class="w-full p-2 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">칭호 / 설명</label>
                    <input type="text" id="input-champ-title" placeholder="예: 황혼의 파수꾼" 
                        class="w-full p-2 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">포지션 선택 (중복 선택 가능)</label>
                    <div id="input-champ-lane-checkboxes" class="flex flex-wrap gap-2 p-2 bg-[#0a1428] border border-[#1e2328] rounded max-h-32 overflow-y-auto">
                        <!-- Dynamic Checkboxes -->
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">프로필 이미지 URL (선택)</label>
                    <input type="url" id="input-champ-img" placeholder="https://..." 
                        class="w-full p-2 bg-[#0a1428] border border-[#1e2328] rounded text-sm focus:border-[#c8aa6e] outline-none text-gray-200">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="btn-close-champ-modal" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-xs font-bold rounded">취소</button>
                <button id="btn-confirm-champ-modal" class="px-4 py-2 bg-[#c8aa6e] hover:bg-[#785a28] text-[#091428] text-xs font-bold rounded">저장</button>
            </div>
        </div>
    </div>

    <!-- Firebase Cloud Storage SDK Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Configuration
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lol-guide-app-default';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Pre-populated Default Guides & Database Seed Data
        const SEED_GUIDES = {
            "lok": {
                runes: "주 룬: 정밀 - 정복자 / 승전보 / 전설: 민첩함 / 최후의 저항\n보조 룬: 결의 - 뼈 부수기 / 과잉성장",
                items: "시작: 도란의 검 + 1포션\n코어 빌드: 삼위일체 -> 발걸음 분쇄기 -> 스테락의 도전 -> 수호 천사",
                counters: "쉬움: 사이온, 쉔\n어려움: 잭스(E스킬 카운터), 제이스(거리 조절 및 견제)",
                matchupTips: "1~2렙 구간에는 E스킬과 평타 판정을 적극 활용하여 딜교하고, 6렙 이후에는 궁극기 타이밍에 맞춰 정글 리시/갱호응을 노립니다.",
                junglePath: "레드 -> 돌거북 -> 칼날부리 -> 바텀 3렙 갱킹 -> 바위게 주도권 잡기",
                imageUrl: "",
                feedbackList: [
                    { vsChamp: "잭스", result: "패배", text: "잭스 E스킬 켜졌을 때 딜교하지 말고 반대로 뺄 것. 6렙 이후 반격 판정 주의.", date: "2026.10.31 14:20" }
                ]
            },

        // Fetch ALL official LoL Champions from DataDragon API + fallback dataset
        async function fetchAllChampions() {
            try {
                const verRes = await fetch("https://ddragon.leagueoflegends.com/api/versions.json");
                const versions = await verRes.json();
                const latestVersion = versions[0] || "14.20.1";

                const champRes = await fetch(`https://ddragon.leagueoflegends.com/cdn/${latestVersion}/data/ko_KR/champion.json`);
                const champData = await champRes.json();

                const fetchedList = [];
                Object.values(champData.data).forEach(c => {
                    const lanes = CHAMP_LANE_MAP[c.id] || ["미드"];
                    fetchedList.push({
                        id: c.id.toLowerCase(),
                        keyName: c.id,
                        name: c.name,
                        title: c.title,
                        lane: Array.isArray(lanes) ? lanes : [lanes],
                        img: `https://ddragon.leagueoflegends.com/cdn/${latestVersion}/img/champion/${c.image.full}`
                    });
                });

                const customChamps = [
                    { id: "lok", name: "로크", title: "황혼의 파수꾼", lane: ["탑", "정글"], img: "https://placehold.co/120x120/1e2328/c8aa6e?text=Lok" },
                    { id: "ambessa", name: "암베사", title: "군쟁의 총괄자", lane: ["탑", "미드"], img: "https://placehold.co/120x120/1e2328/c8aa6e?text=Ambessa" },
                    { id: "mel", name: "멜", title: "메달르다의 수장", lane: ["미드", "서폿"], img: "https://placehold.co/120x120/1e2328/c8aa6e?text=Mel" }
                ];

                customChamps.forEach(custom => {
                    if (!fetchedList.some(item => item.id === custom.id)) {
                        fetchedList.push(custom);
                    }
                });

                fetchedList.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
                return fetchedList;
            } catch (e) {
                console.warn("Riot API Fetch blocked or failed. Using built-in 173 champions fallback list.", e);
                return FALLBACK_CHAMPIONS;
            }
        }

        async function initApp() {
            // Guarantee immediate champion rendering even offline or cross-origin
            championsState = [...FALLBACK_CHAMPIONS];
            renderLines();
            renderChampions();
            setupEventListeners();

            // Attempt async API update
            const apiChamps = await fetchAllChampions();
            if (apiChamps && apiChamps.length > 0) {
                championsState = apiChamps;
                renderChampions();
            }

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn("Auth initialization fallback:", err);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    subscribeToData();
                }
            });
        }

        function subscribeToData() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'lol_guide_app_store', 'main_store');
            
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.lines && Array.isArray(data.lines)) {
                        linesState = data.lines;
                    }
                    if (data.champions && Array.isArray(data.champions)) {
                        championsState = data.champions;
                    }
                    if (data.guides && typeof data.guides === 'object') {
                        guidesData = { ...SEED_GUIDES, ...data.guides };
                    }
                    renderLines();
                    renderChampions();
                    if (selectedChampId) {
                        loadGuideDetails(selectedChampId);
                    }
                }
            }, (err) => {
                console.warn("Firestore snapshot error:", err);
            });
        }

        async function syncDataToCloud() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'lol_guide_app_store', 'main_store');
            try {
                await setDoc(docRef, {
                    lines: linesState,
                    champions: championsState,
                    guides: guidesData,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                showToast("구름 데이터베이스에 저장되었습니다!");
            } catch (err) {
                console.error("Error saving data to Firestore:", err);
                showToast("저장 중 오류가 발생했습니다.", true);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toast-msg");
            toastMsg.textContent = message;
            if (isError) {
                toast.classList.remove("bg-[#c8aa6e]", "text-[#091428]");
                toast.classList.add("bg-red-600", "text-white");
            } else {
                toast.classList.remove("bg-red-600", "text-white");
                toast.classList.add("bg-[#c8aa6e]", "text-[#091428]");
            }
            toast.classList.remove("hidden");
            toast.classList.add("flex");
            setTimeout(() => {
                toast.classList.add("hidden");
                toast.classList.remove("flex");
            }, 3000);
        }

        function renderLines() {
            const container = document.getElementById("line-tab-container");
            container.innerHTML = "";

            linesState.forEach(line => {
                const btn = document.createElement("button");
                const isActive = selectedLine === line.name || (line.id === 'all' && selectedLine === 'all');
                btn.className = `px-3 py-1.5 text-xs font-semibold rounded flex items-center gap-1.5 transition ${
                    isActive 
                    ? 'bg-[#c8aa6e] text-[#091428] shadow font-bold' 
                    : 'bg-[#091428] text-gray-300 border border-[#1e2328] hover:border-[#c8aa6e]'
                }`;
                btn.innerHTML = `<i class="fa-solid ${line.icon || 'fa-shield'}"></i> ${line.name}`;
                btn.onclick = () => {
                    selectedLine = line.name === "전체" ? "all" : line.name;
                    renderLines();
                    renderChampions();
                };
                container.appendChild(btn);
            });

            // Render Checkboxes for Champion Add/Edit Modal
            const checkboxContainer = document.getElementById("input-champ-lane-checkboxes");
            checkboxContainer.innerHTML = "";
            linesState.filter(l => l.id !== 'all').forEach(l => {
                const label = document.createElement("label");
                label.className = "inline-flex items-center gap-1 text-xs text-gray-300 cursor-pointer bg-[#091428] px-2 py-1 rounded border border-[#1e2328] hover:border-[#c8aa6e]";
                label.innerHTML = `
                    <input type="checkbox" value="${l.name}" class="champ-lane-checkbox accent-[#c8aa6e]">
                    <span>${l.name}</span>
                `;
                checkboxContainer.appendChild(label);
            });
        }

        function renderChampions() {
            const grid = document.getElementById("champion-grid");
            const searchKeyword = document.getElementById("champ-search-input").value.trim().toLowerCase();
            grid.innerHTML = "";

            const filtered = championsState.filter(c => {
                const champLanes = Array.isArray(c.lane) ? c.lane : [c.lane];
                const matchesLine = selectedLine === "all" || champLanes.includes(selectedLine);
                const matchesSearch = c.name.toLowerCase().includes(searchKeyword);
                return matchesLine && matchesSearch;
            });

            document.getElementById("champ-count").textContent = filtered.length;

            filtered.forEach(champ => {
                const card = document.createElement("div");
                const isSelected = selectedChampId === champ.id;
                card.className = `hextech-card p-2 rounded cursor-pointer flex flex-col items-center text-center relative ${
                    isSelected ? 'border-2 border-[#c8aa6e] bg-[#1e2328]' : ''
                }`;
                
                const fallbackImg = `https://placehold.co/120x120/1e2328/c8aa6e?text=${encodeURIComponent(champ.name)}`;
                const laneText = Array.isArray(champ.lane) ? champ.lane.join('/') : (champ.lane || '');
                
                card.innerHTML = `
                    <div class="relative w-12 h-12 sm:w-14 sm:h-14 mb-1">
                        <img src="${champ.img || fallbackImg}" 
                             onerror="this.src='${fallbackImg}'" 
                             alt="${champ.name}" 
                             class="w-full h-full object-cover rounded-md border border-[#c8aa6e]/40">
                        <span class="absolute bottom-0 right-0 bg-[#091428] text-[#c8aa6e] text-[9px] px-1 font-bold rounded border border-[#c8aa6e]/30 max-w-full truncate">
                            ${laneText}
                        </span>
                    </div>
                    <span class="text-xs font-bold text-gray-200 truncate w-full">${champ.name}</span>
                `;

                card.onclick = () => {
                    selectedChampId = champ.id;
                    renderChampions();
                    loadGuideDetails(champ.id);
                };

                grid.appendChild(card);
            });
        }

        function loadGuideDetails(champId) {
            const champ = championsState.find(c => c.id === champId);
            if (!champ) return;

            document.getElementById("no-selection-view").classList.add("hidden");
            document.getElementById("guide-detail-view").classList.remove("hidden");

            const fallbackImg = `https://placehold.co/120x120/1e2328/c8aa6e?text=${encodeURIComponent(champ.name)}`;
            const imgEl = document.getElementById("detail-champ-img");
            imgEl.src = champ.img || fallbackImg;
            imgEl.onerror = () => { imgEl.src = fallbackImg; };
            document.getElementById("detail-champ-name").textContent = champ.name;
            
            const lanesList = Array.isArray(champ.lane) ? champ.lane : [champ.lane];
            document.getElementById("detail-champ-lane").textContent = lanesList.join(', ');
            document.getElementById("detail-champ-title").textContent = champ.title || "";

            const jungleSec = document.getElementById("jungle-path-section");
            if (lanesList.includes("정글")) {
                jungleSec.classList.remove("hidden");
            } else {
                jungleSec.classList.add("hidden");
            }

            const guide = guidesData[champId] || {};
            document.getElementById("guide-runes").value = guide.runes || "";
            document.getElementById("guide-items").value = guide.items || "";
            document.getElementById("guide-counters").value = guide.counters || "";
            document.getElementById("guide-matchup-tips").value = guide.matchupTips || "";
            document.getElementById("guide-jungle-path").value = guide.junglePath || "";
            document.getElementById("guide-image-url").value = guide.imageUrl || "";

            const imgPreviewBox = document.getElementById("guide-image-preview-box");
            const imgPreview = document.getElementById("guide-image-preview");
            if (guide.imageUrl) {
                imgPreview.src = guide.imageUrl;
                imgPreviewBox.classList.remove("hidden");
            } else {
                imgPreviewBox.classList.add("hidden");
            }

            renderFeedbackList(guide.feedbackList || []);
        }

        function renderFeedbackList(feedbackList) {
            const container = document.getElementById("feedback-history-list");
            container.innerHTML = "";

            if (!feedbackList || feedbackList.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 italic p-3 text-center">아직 작성된 피드백이 없습니다. 플레이 후 피드백을 작성해보세요!</p>`;
                return;
            }

            feedbackList.forEach((fb, idx) => {
                const item = document.createElement("div");
                const resultColor = fb.result === '승리' ? 'text-emerald-400 border-emerald-500/30' : (fb.result === '패배' ? 'text-red-400 border-red-500/30' : 'text-yellow-400 border-yellow-500/30');
                
                item.className = `p-3 bg-[#091428] rounded border ${resultColor} text-xs flex flex-col gap-1 relative group`;
                item.innerHTML = `
                    <div class="flex justify-between items-center border-b border-gray-800 pb-1">
                        <span class="font-bold">VS ${fb.vsChamp || '미지'} [${fb.result}]</span>
                        <span class="text-[10px] text-gray-500">${fb.date}</span>
                    </div>
                    <p class="text-gray-300 mt-1 whitespace-pre-wrap">${fb.text}</p>
                    <button class="btn-delete-fb absolute top-2 right-2 text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition" data-idx="${idx}">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                `;
                container.appendChild(item);
            });

            container.querySelectorAll(".btn-delete-fb").forEach(btn => {
                btn.onclick = (e) => {
                    const index = parseInt(e.currentTarget.getAttribute("data-idx"));
                    if (!selectedChampId) return;
                    if (!guidesData[selectedChampId]) return;
                    guidesData[selectedChampId].feedbackList.splice(index, 1);
                    syncDataToCloud();
                };
            });
        }

        function setupEventListeners() {
            document.getElementById("champ-search-input").addEventListener("input", renderChampions);

            const tabBtnGuide = document.getElementById("tab-btn-guide");
            const tabBtnFb = document.getElementById("tab-btn-feedback");
            const tabContentGuide = document.getElementById("tab-content-guide");
            const tabContentFb = document.getElementById("tab-content-feedback");

            tabBtnGuide.onclick = () => {
                tabBtnGuide.className = "pb-2 border-b-2 border-[#c8aa6e] text-[#c8aa6e] flex items-center gap-2 font-bold";
                tabBtnFb.className = "pb-2 border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2";
                tabContentGuide.classList.remove("hidden");
                tabContentFb.classList.add("hidden");
            };

            tabBtnFb.onclick = () => {
                tabBtnFb.className = "pb-2 border-b-2 border-[#c8aa6e] text-[#c8aa6e] flex items-center gap-2 font-bold";
                tabBtnGuide.className = "pb-2 border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2";
                tabContentFb.classList.remove("hidden");
                tabContentGuide.classList.add("hidden");
            };

            document.getElementById("guide-image-url").addEventListener("change", (e) => {
                const url = e.target.value.trim();
                const previewBox = document.getElementById("guide-image-preview-box");
                const previewImg = document.getElementById("guide-image-preview");
                if (url) {
                    previewImg.src = url;
                    previewBox.classList.remove("hidden");
                } else {
                    previewBox.classList.add("hidden");
                }
            });

            document.getElementById("btn-save-guide").onclick = () => {
                if (!selectedChampId) return;

                const runes = document.getElementById("guide-runes").value.trim();
                const items = document.getElementById("guide-items").value.trim();
                const counters = document.getElementById("guide-counters").value.trim();
                const matchupTips = document.getElementById("guide-matchup-tips").value.trim();
                const junglePath = document.getElementById("guide-jungle-path").value.trim();
                const imageUrl = document.getElementById("guide-image-url").value.trim();

                if (!guidesData[selectedChampId]) {
                    guidesData[selectedChampId] = { feedbackList: [] };
                }

                guidesData[selectedChampId].runes = runes;
                guidesData[selectedChampId].items = items;
                guidesData[selectedChampId].counters = counters;
                guidesData[selectedChampId].matchupTips = matchupTips;
                guidesData[selectedChampId].junglePath = junglePath;
                guidesData[selectedChampId].imageUrl = imageUrl;

                syncDataToCloud();
            };

            document.getElementById("btn-add-feedback").onclick = () => {
                if (!selectedChampId) return;

                const vsChamp = document.getElementById("fb-vs-champ").value.trim();
                const result = document.getElementById("fb-result").value;
                const text = document.querySelector('#tab-content-feedback textarea').value.trim();

                if (!text) {
                    showToast("피드백 내용을 입력해주세요.", true);
                    return;
                }

                if (!guidesData[selectedChampId]) {
                    guidesData[selectedChampId] = { feedbackList: [] };
                }
                if (!guidesData[selectedChampId].feedbackList) {
                    guidesData[selectedChampId].feedbackList = [];
                }

                const now = new Date();
                const dateStr = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

                guidesData[selectedChampId].feedbackList.unshift({
                    vsChamp: vsChamp,
                    result: result,
                    text: text,
                    date: dateStr
                });

                document.getElementById("fb-vs-champ").value = "";
                document.querySelector('#tab-content-feedback textarea').value = "";

                syncDataToCloud();
            };

            const modalLine = document.getElementById("modal-line");
            document.getElementById("btn-add-line").onclick = () => { modalLine.classList.remove("hidden"); modalLine.classList.add("flex"); };
            document.getElementById("btn-close-line-modal").onclick = () => { modalLine.classList.add("hidden"); modalLine.classList.remove("flex"); };
            
            document.getElementById("btn-confirm-line-modal").onclick = () => {
                const name = document.getElementById("input-line-name").value.trim();
                const icon = document.getElementById("input-line-icon").value;
                if (!name) return;

                const lineId = name.toLowerCase().replace(/\s+/g, '-');
                if (!linesState.some(l => l.name === name)) {
                    linesState.push({ id: lineId, name: name, icon: icon });
                    syncDataToCloud();
                }
                document.getElementById("input-line-name").value = "";
                modalLine.classList.add("hidden");
                modalLine.classList.remove("flex");
            };

            const modalChamp = document.getElementById("modal-champ");
            let editingChampId = null;

            document.getElementById("btn-add-champ").onclick = () => {
                editingChampId = null;
                document.getElementById("modal-champ-title").textContent = "새 챔피언 추가";
                document.getElementById("input-champ-name").value = "";
                document.getElementById("input-champ-title").value = "";
                document.getElementById("input-champ-img").value = "";
                
                document.querySelectorAll(".champ-lane-checkbox").forEach(cb => cb.checked = false);

                modalChamp.classList.remove("hidden");
                modalChamp.classList.add("flex");
            };

            document.getElementById("btn-edit-champ").onclick = () => {
                if (!selectedChampId) return;
                const champ = championsState.find(c => c.id === selectedChampId);
                if (!champ) return;

                editingChampId = champ.id;
                document.getElementById("modal-champ-title").textContent = "챔피언 정보 수정";
                document.getElementById("input-champ-name").value = champ.name;
                document.getElementById("input-champ-title").value = champ.title || "";
                document.getElementById("input-champ-img").value = champ.img || "";
                
                const currentLanes = Array.isArray(champ.lane) ? champ.lane : [champ.lane];
                document.querySelectorAll(".champ-lane-checkbox").forEach(cb => {
                    cb.checked = currentLanes.includes(cb.value);
                });

                modalChamp.classList.remove("hidden");
                modalChamp.classList.add("flex");
            };

            document.getElementById("btn-close-champ-modal").onclick = () => {
                modalChamp.classList.add("hidden");
                modalChamp.classList.remove("flex");
            };

            document.getElementById("btn-confirm-champ-modal").onclick = () => {
                const name = document.getElementById("input-champ-name").value.trim();
                const title = document.getElementById("input-champ-title").value.trim();
                const img = document.getElementById("input-champ-img").value.trim();

                const selectedLanes = Array.from(document.querySelectorAll(".champ-lane-checkbox:checked")).map(cb => cb.value);

                if (!name) {
                    showToast("챔피언 이름을 입력해주세요.", true);
                    return;
                }

                if (selectedLanes.length === 0) {
                    showToast("적어도 하나 이상의 포지션을 선택해주세요.", true);
                    return;
                }

                if (editingChampId) {
                    const targetIdx = championsState.findIndex(c => c.id === editingChampId);
                    if (targetIdx !== -1) {
                        championsState[targetIdx].name = name;
                        championsState[targetIdx].title = title;
                        championsState[targetIdx].lane = selectedLanes;
                        if (img) championsState[targetIdx].img = img;
                    }
                } else {
                    const newId = "champ_" + Date.now();
                    championsState.push({
                        id: newId,
                        name: name,
                        title: title,
                        lane: selectedLanes,
                        img: img || `https://placehold.co/120x120/1e2328/c8aa6e?text=${encodeURIComponent(name)}`
                    });
                    selectedChampId = newId;
                }

                syncDataToCloud();
                modalChamp.classList.add("hidden");
                modalChamp.classList.remove("flex");
            };
        }

        window.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
